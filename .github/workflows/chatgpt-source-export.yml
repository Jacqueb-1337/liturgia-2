name: Temporary ChatGPT source export

on:
  push:
    branches:
      - chatgpt-liturgia-asset-export-20260719
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: zip -q -r liturgia-source.zip . -x '.git/*' 'liturgia-source.zip' '.github/workflows/chatgpt-source-export.yml' '.chatgpt-export-trigger'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: liturgia-source-export
          path: liturgia-source.zip
          retention-days: 1
          compression-level: 0
