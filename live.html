<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Liturgia Live Display</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #live-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #live-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }
    #live-number {
      font-size: 1.5em;
      align-self: flex-start;
      vertical-align: super;
      line-height: 1;
    }
    #live-text {
      font-size: 2em;
      text-align: center;
      flex: 1;
      overflow-wrap: break-word;
      word-break: break-word;
      max-width: 100%;
      padding: 0 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Inline verse number style for live multi-verse passages */
    #live-text p { margin: 0; }
    #live-text p sub.verse-num { font-size: 0.65em; vertical-align: sub; margin-right: 6px; opacity: 0.9; }
    #live-reference {
      font-size: 0.8em;
      align-self: flex-end;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <img id="live-gif-bg" style="position:absolute;top:0;left:0;width:100vw;height:100vh;object-fit:cover;display:none;z-index:0;" alt="">
  <canvas id="live-canvas" style="position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:1;will-change:transform;"></canvas>
  <canvas id="live-text-canvas" style="position:absolute;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:2;display:block;will-change:transform;"></canvas>
  <img id="live-mirror-img" alt=""
       style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:100;display:none;">
  <script>
    const { ipcRenderer } = require('electron');
    
    const bgCanvas = document.getElementById('live-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const textCanvas = document.getElementById('live-text-canvas');
    const textCtx = textCanvas.getContext('2d');
    // Backwards-compatible aliases for older code that references `canvas`/`ctx`
    const canvas = bgCanvas;
    const ctx = bgCtx;

    // Website mirror — receives JPEG frames from preview webview via IPC
    const mirrorImg = document.getElementById('live-mirror-img');
    let _mirrorBlobUrl = null;
    let _mirrorEnabled = false; // true only while website mirror mode is active

    function showMirrorVideo() { // keep old name so all call sites work
      mirrorImg.style.display = 'block';
    }
    function hideMirrorVideo() {
      mirrorImg.style.display = 'none';
      mirrorImg.src = '';
      if (_mirrorBlobUrl) { URL.revokeObjectURL(_mirrorBlobUrl); _mirrorBlobUrl = null; }
    }

    // GIF background element — sits behind canvases so animated GIFs play natively
    const gifBg = document.getElementById('live-gif-bg');
    function setGifBg(path, media) {
      const size = (media && media.bgSize) || 'cover';
      gifBg.style.objectFit = size === 'contain' ? 'contain' : (size === 'fill' ? 'fill' : 'cover');
      gifBg.style.objectPosition = (media && media.bgPosition) || 'center';
      // Only reassign src when the path actually changes — setting .src always
      // resets browser GIF animation back to frame 0, even if the URL is identical.
      const fileUrl = _fileUrlFor ? _fileUrlFor(path) : ('file:///' + (path || '').replace(/\\/g, '/'));
      if (gifBg.dataset.liveSrc !== fileUrl) {
        gifBg.src = fileUrl;
        gifBg.dataset.liveSrc = fileUrl;
      }
      gifBg.style.display = 'block';
    }
    function clearGifBg() {
      gifBg.style.display = 'none';
      gifBg.src = '';
      gifBg.dataset.liveSrc = '';
    }
    function isStaticImageType(type) {
      return ['JPG','JPEG','PNG','WEBP','BMP'].includes(type);
    }

    // License watermark state (updated from main via ipc)
    let licenseStatus = { active: true };
    ipcRenderer.on('license-status', (event, status) => {
      licenseStatus = status || { active: false };
      // Refresh current content so watermark is placed under text
      refreshContentWithWatermark().catch(e => { console.error('Failed to refresh content for watermark:', e); });
    });

    // Initialize from main process stored status (if available)
    (async () => {
      try {
        const s = await ipcRenderer.invoke('get-current-license-status');
        if (s) { licenseStatus = s; await refreshContentWithWatermark(); }
      } catch (e) { /* ignore */ }
    })();

    // Load saved audio output device so newly created videos use it automatically
    window._audioOutputDeviceId = 'default';
    (async () => {
      try {
        const s = await ipcRenderer.invoke('load-settings');
        if (s && s.audioOutputDeviceId) window._audioOutputDeviceId = s.audioOutputDeviceId;
      } catch (e) { /* ignore */ }
    })();

    // Render text content to an offscreen canvas and return it
    function renderTextToCanvas(content, width, height) {
      // Delegate to buildTextCanvas which supports all style properties.
      // Falls back to currentRenderWidth/Height if width/height not supplied.
      const W = (typeof width  === 'number' && width  > 0) ? width  : (currentRenderWidth  || window.innerWidth);
      const H = (typeof height === 'number' && height > 0) ? height : (currentRenderHeight || window.innerHeight);
      return buildTextCanvas(content, W, H);
    }
    // Refresh the visible canvas so watermark is placed between background and text
    async function refreshContentWithWatermark() {
      if (!canvas || !ctx) return;

      // Respect current display mode — do not break black/clear state
      if (isBlackMode) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawLicenseWatermark();
        return;
      }

      if (!window.currentContent) {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawLicenseWatermark();
        return;
      }

      const width  = canvas.width;
      const height = canvas.height;
      const _bg     = window.currentContent.backgroundMedia || null;
      const _bgType = _bg ? _bg.type : null;
      const _bgIsVideo = _bgType && ['MP4','WEBM','OGG','MOV','AVI'].includes(_bgType);
      const _bgIsGif   = _bgType === 'GIF';
      const _rwGlobal  = (window.currentContent.styles && window.currentContent.styles.global) || {};
      const _rwOverlay = _rwGlobal.overlayOpacity !== undefined ? _rwGlobal.overlayOpacity : 0.4;
      const _rwBlur    = parseFloat(_rwGlobal.bgBlur) || 0;

      // VIDEO: the rAF draw-loop owns bgCtx every frame — do NOT cancel it or write to
      // bgCtx, or the text will be erased on the very next frame.  Just restore textCtx.
      if (_bgIsVideo && window._liveBgVideo) {
        if (isClearMode) {
          textCtx.clearRect(0, 0, width, height);
        } else if (window.currentContent.text) {
          const txt = renderTextToCanvas(window.currentContent, width, height);
          textCtx.clearRect(0, 0, width, height);
          textCtx.drawImage(txt, 0, 0);
        }
        return;
      }

      // GIF: the animated <img> element is the real background — drawing a static image
      // frame onto bgCtx with renderBackgroundToCanvas would freeze the animation.
      // Instead, just re-assert the semi-transparent overlay on bgCtx and restore textCtx.
      if (_bgIsGif) {
        if (_bg && _bg.path) setGifBg(_bg.path, _bg);
        gifBg.style.filter = _rwBlur > 0 ? `blur(${_rwBlur * height / 1080}px)` : '';
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = `rgba(0,0,0,${_rwOverlay})`;
        ctx.fillRect(0, 0, width, height);
        drawLicenseWatermark();
        if (isClearMode) {
          textCtx.clearRect(0, 0, width, height);
        } else if (window.currentContent.text) {
          const txt = renderTextToCanvas(window.currentContent, width, height);
          textCtx.clearRect(0, 0, width, height);
          textCtx.drawImage(txt, 0, 0);
        }
        return;
      }

      // Static backgrounds: cancel any leftover animation, render to offscreen, restore both layers
      if (currentAnimationFrameId) { cancelAnimationFrame(currentAnimationFrameId); currentAnimationFrameId = null; }
      const off = document.createElement('canvas'); off.width = width; off.height = height;
      await renderBackgroundToCanvas(window.currentContent, off);
      ctx.drawImage(off, 0, 0);
      drawLicenseWatermark();
      if (isClearMode) {
        textCtx.clearRect(0, 0, width, height);
      } else if (window.currentContent.text) {
        const txt = renderTextToCanvas(window.currentContent, width, height);
        textCtx.clearRect(0, 0, width, height);
        textCtx.drawImage(txt, 0, 0);
      }
    }

    function drawLicenseWatermark(targetCtx = bgCtx, targetCanvas = bgCanvas) {
      if (!targetCanvas || !targetCtx) { console.debug('[live] drawLicenseWatermark: no target'); return; }
      if (licenseStatus && licenseStatus.active) { console.debug('[live] drawLicenseWatermark: license active - skipping watermark'); return; } // nothing to draw
      console.debug('[live] drawLicenseWatermark: drawing watermark', { active: !!(licenseStatus && licenseStatus.active), width: targetCanvas.width, height: targetCanvas.height });
      targetCtx.save();
      // Large, semi-transparent central watermark (draw on background canvas)
      const minDim = Math.min(targetCanvas.width, targetCanvas.height);
      const bigSize = Math.floor(minDim * 0.2); // 20% of min dimension
      targetCtx.globalAlpha = 0.14;
      targetCtx.fillStyle = '#ffffff';
      targetCtx.textAlign = 'center';
      targetCtx.textBaseline = 'middle';
      targetCtx.translate(targetCanvas.width / 2, targetCanvas.height / 2);
      targetCtx.rotate(-0.25);

      // Draw main title
      targetCtx.font = `bold ${bigSize}px Arial`;
      targetCtx.fillText('LITURGIA', 0, 0);

      // Draw account/email beneath if available (smaller, fainter)
      const email = (licenseStatus && (licenseStatus.token_payload && licenseStatus.token_payload.email)) || (licenseStatus && licenseStatus.user_row && licenseStatus.user_row.email) || null;
      if (email) {
        targetCtx.globalAlpha = 0.10;
        targetCtx.font = `bold ${Math.max(14, Math.floor(bigSize * 0.28))}px Arial`;
        targetCtx.fillText(String(email).toUpperCase(), 0, Math.floor(bigSize * 0.9));
      } else {
        targetCtx.globalAlpha = 0.08;
        targetCtx.font = `bold ${Math.max(12, Math.floor(bigSize * 0.18))}px Arial`;
        targetCtx.fillText('UNLICENSED', 0, Math.floor(bigSize * 0.9));
      }

      targetCtx.restore();
    }

    // Track state for clear/black modes
    let isClearMode = false;
    let isBlackMode = false;
    
    // Set canvas to actual display resolution
    function resizeCanvas() {
      const _newW = window.screen.width;
      const _newH = window.screen.height;
      // Assigning .width/.height on a canvas always resets its content even when the
      // value hasn't changed.  On Windows, Electron fires resize events on alt+tab /
      // focus changes, which would clear both canvases unnecessarily every time.
      if (bgCanvas.width === _newW && bgCanvas.height === _newH &&
          textCanvas.width === _newW && textCanvas.height === _newH) return;
      bgCanvas.width = _newW;
      bgCanvas.height = _newH;
      textCanvas.width = _newW;
      textCanvas.height = _newH;
      // Redraw based on current mode
      if (isBlackMode || isClearMode) {
        // Just fill with black on background and clear text layer
        bgCtx.fillStyle = '#000';
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
        drawLicenseWatermark();
        textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
      } else if (window.currentContent) {
        // Re-render full composition so watermark sits under text
        refreshContentWithWatermark().catch(e => console.error('resize refresh failed', e));
      }
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    function drawImageWithSettings(ctx, img, canvasWidth, canvasHeight, settings = {}) {
      const bgSize = settings.bgSize || 'cover';
      const bgRepeat = settings.bgRepeat || 'no-repeat';
      const bgPosition = settings.bgPosition || 'center';
      
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      
      let drawWidth, drawHeight, scale;
      
      // Calculate dimensions based on background-size
      if (bgSize === 'cover') {
        scale = Math.max(canvasWidth / img.width, canvasHeight / img.height);
        drawWidth = img.width * scale;
        drawHeight = img.height * scale;
      } else if (bgSize === 'contain') {
        scale = Math.min(canvasWidth / img.width, canvasHeight / img.height);
        drawWidth = img.width * scale;
        drawHeight = img.height * scale;
      } else if (bgSize === '100% 100%') {
        drawWidth = canvasWidth;
        drawHeight = canvasHeight;
      } else { // 'auto' - original size
        drawWidth = img.width;
        drawHeight = img.height;
      }
      
      // Calculate position
      let startX = 0, startY = 0;
      if (bgPosition.includes('center') || bgPosition === 'center') {
        startX = (canvasWidth - drawWidth) / 2;
        startY = (canvasHeight - drawHeight) / 2;
      } else {
        const positions = bgPosition.split(' ');
        const posX = positions[0] || 'center';
        const posY = positions[1] || 'center';
        
        if (posX === 'left') startX = 0;
        else if (posX === 'right') startX = canvasWidth - drawWidth;
        else if (posX === 'center') startX = (canvasWidth - drawWidth) / 2;
        
        if (posY === 'top') startY = 0;
        else if (posY === 'bottom') startY = canvasHeight - drawHeight;
        else if (posY === 'center') startY = (canvasHeight - drawHeight) / 2;
      }
      
      // Handle repeat
      if (bgRepeat === 'no-repeat') {
        ctx.drawImage(img, startX, startY, drawWidth, drawHeight);
      } else if (bgRepeat === 'repeat') {
        for (let x = startX % drawWidth - drawWidth; x < canvasWidth; x += drawWidth) {
          for (let y = startY % drawHeight - drawHeight; y < canvasHeight; y += drawHeight) {
            ctx.drawImage(img, x, y, drawWidth, drawHeight);
          }
        }
      } else if (bgRepeat === 'repeat-x') {
        for (let x = startX % drawWidth - drawWidth; x < canvasWidth; x += drawWidth) {
          ctx.drawImage(img, x, startY, drawWidth, drawHeight);
        }
      } else if (bgRepeat === 'repeat-y') {
        for (let y = startY % drawHeight - drawHeight; y < canvasHeight; y += drawHeight) {
          ctx.drawImage(img, startX, y, drawWidth, drawHeight);
        }
      }
    }
    
    function applyColorToCanvas(ctx, colorCSS, width, height) {
      // Check if it's a gradient
      if (colorCSS.startsWith('linear-gradient')) {
        // Parse linear-gradient(135deg, #667eea, #764ba2)
        const match = colorCSS.match(/linear-gradient\((\d+)deg,\s*([^,]+),\s*(.+)\)/);
        if (match) {
          const angle = parseInt(match[1]);
          const color1 = match[2].trim();
          const color2 = match[3].trim();
          
          // Convert angle to radians and calculate gradient direction
          const angleRad = (angle - 90) * Math.PI / 180;
          const x1 = width / 2 + Math.cos(angleRad) * width / 2;
          const y1 = height / 2 + Math.sin(angleRad) * height / 2;
          const x2 = width / 2 - Math.cos(angleRad) * width / 2;
          const y2 = height / 2 - Math.sin(angleRad) * height / 2;
          
          const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
          gradient.addColorStop(0, color1);
          gradient.addColorStop(1, color2);
          ctx.fillStyle = gradient;
        }
      } else if (colorCSS.startsWith('radial-gradient')) {
        // Parse radial-gradient(circle, #667eea, #764ba2)
        const match = colorCSS.match(/radial-gradient\(circle,\s*([^,]+),\s*(.+)\)/);
        if (match) {
          const color1 = match[1].trim();
          const color2 = match[2].trim();
          
          const gradient = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) / 2);
          gradient.addColorStop(0, color1);
          gradient.addColorStop(1, color2);
          ctx.fillStyle = gradient;
        }
      } else {
        // Solid color
        ctx.fillStyle = colorCSS;
      }
      ctx.fillRect(0, 0, width, height);
    }
    
    /**
     * Apply fade-in animation to canvas
     */
    function applyFadeInAnimation(duration = 1.0, callback = null) {
      const startTime = Date.now();
      const originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      
      const animate = () => {
        const elapsed = (Date.now() - startTime) / 1000;
        const progress = Math.min(elapsed / duration, 1);
        
        // Create a copy of the image data with adjusted alpha
        const imageData = ctx.createImageData(originalImageData);
        const data = imageData.data;
        const originalData = originalImageData.data;
        
        // Adjust alpha channel for all pixels
        for (let i = 3; i < data.length; i += 4) {
          data[i] = Math.round(originalData[i] * progress);
        }
        
        // Clear canvas and redraw with faded image
        ctx.fillStyle = 'rgba(0, 0, 0, 0)';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.putImageData(imageData, 0, 0);
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          ctx.putImageData(originalImageData, 0, 0);
          // Ensure watermark is present after fade finishes
          drawLicenseWatermark();
          if (callback) callback();
        }
      };
      
      animate();
    }
    
    let currentRenderContent = null;
    let currentRenderWidth = 0;
    let currentRenderHeight = 0;
    let currentAnimationFrameId = null;
    
    /**
     * Apply fade-out animation to remove current text
     */
    function applyTextFadeOutAnimation(oldContent, duration = 1, animationType = 'fade', callback) {
      // Check if there's actually content to fade out
      if (!oldContent || !oldContent.text) {
        if (callback) callback();
        return;
      }

      const startTime = Date.now();
      const width = currentRenderWidth;
      const height = currentRenderHeight;

      // If a video loop is actively drawing to bgCtx (ctx), DO NOT touch bgCtx at all —
      // any putImageData/fillRect here will overwrite the video frame just painted and
      // produce a visible freeze.  Animate text-only on textCtx instead, mirroring the
      // approach used by applyTextFadeInAnimation.
      const _liveVidRunning = !!(window._liveBgVideo && !window._liveBgVideo.paused);

      // Pre-render the OLD text using buildTextCanvas (full style support)
      const textCanvas = buildTextCanvas(oldContent, width, height);
      // Capture background snapshot only when no video loop owns bgCtx.
      const backgroundImageData = _liveVidRunning ? null : ctx.getImageData(0, 0, width, height);

      // Easing helper (smooth acceleration/deceleration)
      function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

      const animate = () => {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / (duration * 1000), 1);
        const eased = easeInOutCubic(progress);
        const reverseEased = 1 - eased;

        if (_liveVidRunning) {
          // Video loop owns bgCtx — animate text fade-out on textCtx only.
          textCtx.clearRect(0, 0, width, height);
          if (animationType === 'fade') {
            textCtx.globalAlpha = reverseEased;
            textCtx.drawImage(textCanvas, 0, 0);
            textCtx.globalAlpha = 1;
          } else if (animationType === 'slide-left') {
            textCtx.drawImage(textCanvas, -(eased * width), 0);
          } else if (animationType === 'slide-right') {
            textCtx.drawImage(textCanvas, eased * width, 0);
          } else if (animationType === 'slide-up') {
            textCtx.drawImage(textCanvas, 0, -(eased * height));
          } else if (animationType === 'slide-down') {
            textCtx.drawImage(textCanvas, 0, eased * height);
          }
        } else {
          // Static/image/color background — composite on bgCtx as before.
          ctx.putImageData(backgroundImageData, 0, 0);
          drawLicenseWatermark();
          if (animationType === 'fade') {
            ctx.globalAlpha = reverseEased;
            ctx.drawImage(textCanvas, 0, 0);
            ctx.globalAlpha = 1;
          } else if (animationType === 'slide-left') {
            ctx.drawImage(textCanvas, -(eased * width), 0);
          } else if (animationType === 'slide-right') {
            ctx.drawImage(textCanvas, eased * width, 0);
          } else if (animationType === 'slide-up') {
            ctx.drawImage(textCanvas, 0, -(eased * height));
          } else if (animationType === 'slide-down') {
            ctx.drawImage(textCanvas, 0, eased * height);
          }
        }

        if (progress < 1) {
          currentAnimationFrameId = requestAnimationFrame(animate);
        } else {
          // Animation complete
          currentAnimationFrameId = null;
          if (_liveVidRunning) textCtx.clearRect(0, 0, width, height);
          if (callback) callback();
        }
      };

      // Run first frame synchronously to start animation immediately
      currentAnimationFrameId = requestAnimationFrame(animate);
    }
    
    /**
     * Apply text animation with support for fade and slide effects
     */
    function applyTextFadeInAnimation(duration = 1.0, animationType = 'fade', callback = null) {
      const startTime = Date.now();
      const content = currentRenderContent;
      const width = currentRenderWidth;
      const height = currentRenderHeight;

      // Pre-render text using buildTextCanvas (full style support)
      const off = buildTextCanvas(content, width, height);
      // Animate onto the text canvas
      function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

      const animate = () => {
        // If clear or black mode became active while this animation was in-flight,
        // stop drawing immediately and ensure textCtx is clean.
        if (isClearMode || isBlackMode) {
          currentAnimationFrameId = null;
          try { textCtx.clearRect(0, 0, width, height); } catch (e) {}
          if (callback) callback();
          return;
        }

        const elapsed = (Date.now() - startTime) / 1000;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeInOutCubic(progress);

        // Clear text canvas and draw with eased alpha/offset
        textCtx.clearRect(0, 0, width, height);
        if (animationType === 'fade') {
          textCtx.globalAlpha = eased;
          textCtx.drawImage(off, 0, 0);
          textCtx.globalAlpha = 1;
        } else if (animationType === 'slide-left') {
          const offset = (1 - eased) * width;
          textCtx.drawImage(off, offset, 0);
        } else if (animationType === 'slide-right') {
          const offset = (eased - 1) * width;
          textCtx.drawImage(off, offset, 0);
        } else if (animationType === 'slide-up') {
          const offset = (1 - eased) * height;
          textCtx.drawImage(off, 0, offset);
        } else if (animationType === 'slide-down') {
          const offset = (eased - 1) * height;
          textCtx.drawImage(off, 0, offset);
        }

        if (progress < 1) {
          currentAnimationFrameId = requestAnimationFrame(animate);
        } else {
          currentAnimationFrameId = null;
          textCtx.clearRect(0, 0, width, height);
          textCtx.drawImage(off, 0, 0);
          // Defensive: ensure watermark is present after fade-in completes
          try { drawLicenseWatermark(ctx, canvas); } catch (e) { console.warn('[live] drawLicenseWatermark failed after fade-in', e); }
          if (callback) callback();
        }
      };

      currentAnimationFrameId = requestAnimationFrame(animate);
    }
    
    // Helper: compare backgrounds (supports backgroundMedia and legacy backgroundPath)
    function backgroundsEqual(a, b) {
      if (!a && !b) return true;
      if (!a || !b) return false;

      // Handle explicit backgroundMedia first
      const am = a.backgroundMedia || (a.isMedia ? { type: a.mediaType, path: a.mediaPath, color: a.mediaColor } : null);
      const bm = b.backgroundMedia || (b.isMedia ? { type: b.mediaType, path: b.mediaPath, color: b.mediaColor } : null);

      if (am || bm) {
        if (!am || !bm) return false;
        if (am.type !== bm.type) return false;
        if (am.type === 'COLOR') return am.color === bm.color;
        if (am.path && bm.path) return am.path === bm.path;
        return false;
      }

      // Legacy backgroundPath or color
      if (a.backgroundPath || b.backgroundPath) {
        return (a.backgroundPath || '') === (b.backgroundPath || '');
      }

      return false;
    }

    // Helper: file URL helper that delegates to preload-exposed paths.fileUrlFor
    function _fileUrlFor(p) {
      try { if (window && window.paths && typeof window.paths.fileUrlFor === 'function') return window.paths.fileUrlFor(p); } catch (e) {}

    /**
     * Parse text into segments of verse numbers and text
     */
    function parseVerseSegments(text) {
      const segments = [];
      const regex = /(\d+)\s{2}/g;
      let lastIndex = 0;
      let match;
      
      while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          const textBefore = text.substring(lastIndex, match.index).trim();
          if (textBefore) segments.push({ isNumber: false, text: textBefore });
        }
        segments.push({ isNumber: true, text: match[1] });
        lastIndex = regex.lastIndex;
      }
      
      if (lastIndex < text.length) {
        const remaining = text.substring(lastIndex).trim();
        if (remaining) segments.push({ isNumber: false, text: remaining });
      }
      
      return segments;
    }

    // Parse inline Markdown in a string into an array of word objects with style flags
    // Supports: **bold**, __bold__, *italic*, _italic_
    function parseInlineMarkdownWords(s) {
      const out = [];
      if (!s) return out;

      const tokenRegex = /(\*\*|__)([\s\S]+?)\1|(\*|_)([\s\S]+?)\3/g;
      let lastIndex = 0;
      let m;

      while ((m = tokenRegex.exec(s)) !== null) {
        if (m.index > lastIndex) {
          const plain = s.substring(lastIndex, m.index);
          plain.split(' ').forEach((w, i, arr) => {
            if (w === '') return;
            const add = i < arr.length - 1 ? w + ' ' : w;
            out.push({ text: add, bold: false, italic: false });
          });
        }

        if (m[1] && m[2]) {
          // Bold
          m[2].split(' ').forEach((w, i, arr) => {
            if (w === '') return;
            const add = i < arr.length - 1 ? w + ' ' : w;
            out.push({ text: add, bold: true, italic: false });
          });
        } else if (m[3] && m[4]) {
          // Italic
          m[4].split(' ').forEach((w, i, arr) => {
            if (w === '') return;
            const add = i < arr.length - 1 ? w + ' ' : w;
            out.push({ text: add, bold: false, italic: true });
          });
        }

        lastIndex = tokenRegex.lastIndex;
      }

      if (lastIndex < s.length) {
        const rest = s.substring(lastIndex);
        rest.split(' ').forEach((w, i, arr) => {
          if (w === '') return;
          const add = i < arr.length - 1 ? w + ' ' : w;
          out.push({ text: add, bold: false, italic: false });
        });
      }

      if (out.length === 0 && s.trim() !== '') out.push({ text: s, bold: false, italic: false });
      return out;

          const secTextAlign = textSt.textAlign || 'center';
          if ('letterSpacing' in bCtx)

                bCtx.font = fStr(ssz, subSt); bCtx.fillStyle = secSubColor; bCtx.textAlign = 'left';

          if ('letterSpacing' in bCtx) bCtx.letterSpacing = '0px';

    /**

    function wrapTextWithSubscripts(segments, maxWidth, baseFontSize, context = ctx, fontFamily = 'Arial') {

      let currentWidth = 0;
      
      const subscriptSize = baseFontSize * 0.6;
      
      segments.forEach(seg => {
        if (seg.isNumber) {
          context.font = `${subscriptSize}px "${fontFamily}"`;
          const width = context.measureText(seg.text + ' ').width;
          
          if (currentWidth + width > maxWidth && currentLine.length > 0) {
            lines.push(currentLine);
            currentLine = [];
            currentWidth = 0;
          }
          
          currentLine.push(seg);
          currentWidth += width;
          context.font = `${baseFontSize}px "${fontFamily}"`;
        } else {
          // Use parsed words (with bold/italic flags) if available
          const words = seg.words ? seg.words : seg.text.split(' ');
          words.forEach((wordObj, idx) => {
            const wordText = typeof wordObj === 'string' ? wordObj : wordObj.text;
            const testWord = wordText + (idx < words.length - 1 ? ' ' : '');

            // Measure using style-aware font if available
            if (typeof wordObj !== 'string') {
              const fontStr = `${wordObj.italic ? 'italic ' : ''}${wordObj.bold ? 'bold ' : ''}${baseFontSize}px "${fontFamily}"`;
              context.font = fontStr;
            } else {
              context.font = `${baseFontSize}px "${fontFamily}"`;
            }

            const width = context.measureText(testWord).width;
            if (currentWidth + width > maxWidth && currentLine.length > 0) {
              lines.push(currentLine);
              currentLine = [];
              currentWidth = 0;
            }

            if (typeof wordObj === 'string') {
              currentLine.push({ isNumber: false, text: testWord });
            } else {
              currentLine.push({ isNumber: false, text: testWord, bold: !!wordObj.bold, italic: !!wordObj.italic });
            }
            currentWidth += width;
          });
        }

      if (currentLine.length > 0) {
        lines.push(currentLine);

      return lines;

    /**

     */
    
    // Unified mode setter for clear/black/normal; centralizes transitions and avoids IPC races
    // Fade the mirror image out over `duration` seconds, then fully hide it.
    function _fadeMirrorOut(duration) {
      const fadeDurationMs = Math.max(50, (duration || 0.4) * 1000);
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / fadeDurationMs);
        mirrorImg.style.opacity = String(1 - t);
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          hideMirrorVideo();
          mirrorImg.style.opacity = '1';
        }
      };
      requestAnimationFrame(step);
    }

    // Fade the mirror image in over `duration` seconds.
    function _fadeMirrorIn(duration) {
      const fadeDurationMs = Math.max(50, (duration || 0.4) * 1000);
      mirrorImg.style.opacity = '0';
      showMirrorVideo();
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / fadeDurationMs);
        mirrorImg.style.opacity = String(t);
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          mirrorImg.style.opacity = '1';
        }
      };
      requestAnimationFrame(step);
    }

    function setLiveMode(mode) {
      console.debug('[live] setLiveMode ->', mode);
      // Cancel any ongoing canvas animations
      if (currentAnimationFrameId) {
        cancelAnimationFrame(currentAnimationFrameId);
        currentAnimationFrameId = null;
      }
      // Stop any video draw loop. The RVFC-driven loop checks window.currentVideo !== video,
      // so nulling it is the only reliable way to stop it (cancelAnimationFrame won't work).
      if (window.currentVideo) { window.currentVideo = null; }
      window._liveVideoForControl = null;
      if (window._liveBgVideo) {
        try { window._liveBgVideo.pause(); } catch (_) {}
        if (window._liveBgVideo.parentNode) window._liveBgVideo.parentNode.removeChild(window._liveBgVideo);
        window._liveBgVideo = null;
      }
      window._liveBgToken = (window._liveBgToken || 0) + 1;

      // Capture whether the website mirror overlay was visible before we do anything.
      // If it was, we fade it out instead of hiding immediately so the transition looks smooth.
      const _mirrorWasVisible = (mirrorImg.style.display !== 'none');
      _mirrorEnabled = false; // stop accepting new mirror frames immediately

      // Always make canvases visible — they may have been obscured by the mirror
      bgCanvas.style.display = '';
      textCanvas.style.display = '';

      if (mode === 'black') {
        isClearMode = false;
        isBlackMode = true;
        clearGifBg();
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        try { textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height); } catch (e) {}
        currentRenderContent = window.currentContent ? { ...window.currentContent, number: '', text: '', reference: '' } : null;
        if (_mirrorWasVisible) {
          const _dur = (window.currentContent && window.currentContent.transitionIn) ? window.currentContent.transitionIn.duration : 0.4;
          _fadeMirrorOut(_dur);
        } else {
          hideMirrorVideo();
        }
        return;
      }

      if (mode === 'clear') {
        // If already clear, no-op
        if (isClearMode) return;
        isClearMode = true;
        isBlackMode = false;

        const width = canvas.width;
        const height = canvas.height;
        const transitionSettings = window.currentContent && window.currentContent.transitionIn ? window.currentContent.transitionIn : { duration: 0.4, type: 'fade' };

        const renderBackground = () => {
          const _rbMedia = window.currentContent && window.currentContent.backgroundMedia ? window.currentContent.backgroundMedia : null;
          if (_rbMedia && _rbMedia.type === 'COLOR') {
            clearGifBg();
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            applyColorToCanvas(ctx, _rbMedia.color, width, height);
          } else if (_rbMedia && _rbMedia.type === 'GIF') {
            setGifBg(_rbMedia.path, _rbMedia);
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(0, 0, width, height);
          } else if (_rbMedia && isStaticImageType(_rbMedia.type)) {
            clearGifBg();
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            const bgImg = new Image();
            bgImg.onload = () => drawImageWithSettings(ctx, bgImg, width, height, { bgSize: _rbMedia.bgSize || 'cover', bgRepeat: _rbMedia.bgRepeat || 'no-repeat', bgPosition: _rbMedia.bgPosition || 'center' });
            bgImg.src = _fileUrlFor(_rbMedia.path);
          } else {
            clearGifBg();
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
          }
        };

        if (_mirrorWasVisible) {
          // Website mirror was on top — text was never visible to the audience.
          // Render the background on the canvas, clear text immediately, then fade the mirror
          // out so it dissolves smoothly into the background instead of snapping away.
          renderBackground();
          drawLicenseWatermark();
          try { textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height); } catch (e) {}
          currentRenderContent = window.currentContent ? { ...window.currentContent, number: '', text: '', reference: '' } : null;
          _fadeMirrorOut(transitionSettings.duration);
        } else {
          hideMirrorVideo();
          // If there's visible text on screen, fade it out; otherwise just show background
          const hasVisibleText = currentRenderContent && currentRenderContent.text;
          if (hasVisibleText) {
            const oldContent = { ...currentRenderContent };
            renderBackground();
            drawLicenseWatermark();
            // Clear textCtx IMMEDIATELY so the audience sees no text from this instant.
            // applyTextFadeOutAnimation below runs on bgCtx as a subtle background-only
            // transition; textCtx is already blank so text cannot linger even if the
            // callback is delayed or the animation is cancelled mid-way.
            try { textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height); } catch (e) {}
            currentRenderContent = window.currentContent ? { ...window.currentContent, number: '', text: '', reference: '' } : null;
            applyTextFadeOutAnimation(oldContent, transitionSettings.duration, transitionSettings.type || 'fade', () => {
              try { textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height); } catch (e) {}
              currentRenderContent = window.currentContent ? { ...window.currentContent, number: '', text: '', reference: '' } : null;
            });
          } else {
            renderBackground();
            drawLicenseWatermark();
            try { textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height); } catch (e) {}
            currentRenderContent = window.currentContent ? { ...window.currentContent, number: '', text: '', reference: '' } : null;
          }
        }

        return;
      }

      // mode === 'normal'
      hideMirrorVideo();
      isClearMode = false;
      isBlackMode = false;
      if (window.currentContent) renderContent(window.currentContent);
    }

    ipcRenderer.on('update-content', (event, data) => {
      // WEBSITE: mirror overlays on top of canvases — don't wipe window.currentContent
      // so clear/black modes can fall back to the last verse/song content underneath.
      if (data && data.isWebsite) {
        isClearMode = false; isBlackMode = false;
        _mirrorEnabled = true;
        const _fadeDur = (window.currentContent && window.currentContent.transitionIn) ? window.currentContent.transitionIn.duration : 0.4;
        _fadeMirrorIn(_fadeDur);
        return;
      }

      // Non-website: update content and disable mirror
      window.currentContent = data;
      _mirrorEnabled = false;
      hideMirrorVideo();

      // Respect current mode: keep screen black or cleared if those modes are active
      if (isBlackMode) {
        // Keep black screen; currentRenderContent should reflect no text
        const width = canvas.width;
        const height = canvas.height;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
        // Draw watermark on black screen
        drawLicenseWatermark();
        currentRenderContent = {
          ...window.currentContent,
          number: '',
          text: '',
          reference: ''
        };
        return;
      }

      if (isClearMode) {
        // Keep background visible but no text
        const width = canvas.width;
        const height = canvas.height;
        {
          const _cmMedia = window.currentContent && window.currentContent.backgroundMedia ? window.currentContent.backgroundMedia : null;
          if (_cmMedia && _cmMedia.type === 'COLOR') {
            clearGifBg();
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            applyColorToCanvas(ctx, _cmMedia.color, width, height);
          } else if (_cmMedia && _cmMedia.type === 'GIF') {
            setGifBg(_cmMedia.path, _cmMedia);
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(0, 0, width, height);
          } else if (_cmMedia && isStaticImageType(_cmMedia.type)) {
            clearGifBg();
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            const bgImg = new Image();
            bgImg.onload = () => {
              drawImageWithSettings(ctx, bgImg, width, height, {
                bgSize: _cmMedia.bgSize || 'cover',
                bgRepeat: _cmMedia.bgRepeat || 'no-repeat',
                bgPosition: _cmMedia.bgPosition || 'center'
              });
            };
            bgImg.src = _fileUrlFor(_cmMedia.path);
          } else {
            clearGifBg();
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
          }
        }
        currentRenderContent = {
          ...window.currentContent,
          number: '',
          text: '',
          reference: ''
        };
        return;
      }

      // Default: render normally
      renderContent(data);
    });
    
    // Legacy handler delegates to setLiveMode
    ipcRenderer.on('clear-live-text', () => setLiveMode('clear'));

    // Legacy set-live-black delegates to setLiveMode
    ipcRenderer.on('set-live-black', () => setLiveMode('black'));

    // Legacy reset-live-canvas delegates to normal mode
    ipcRenderer.on('reset-live-canvas', () => setLiveMode('normal'));

    // New unified mode handler
    ipcRenderer.on('set-live-mode', (event, mode) => setLiveMode(mode));

    // Mirror: receive JPEG frames from the preview webview (sent via capturePage polling)
    ipcRenderer.on('mirror-frame', (event, jpegBuffer) => {
      // Discard frames if mirror mode is no longer active (prevents website overlay
      // from re-appearing after switching to verse/song/media content)
      if (!_mirrorEnabled) return;
      const prev = _mirrorBlobUrl;
      _mirrorBlobUrl = URL.createObjectURL(new Blob([jpegBuffer], { type: 'image/jpeg' }));
      mirrorImg.src = _mirrorBlobUrl;
      if (prev) URL.revokeObjectURL(prev);
      // Ensure visible (update-content sets display:block, but make sure)
      if (mirrorImg.style.display === 'none') showMirrorVideo();
    });

    // Mirror stopped (e.g. switched to different content)
    ipcRenderer.on('website-mirror-stop', () => {
      _mirrorEnabled = false;
      hideMirrorVideo();
    });

    // Video live bar control commands (sync state and audio routing)
    ipcRenderer.on('video-live-control', (event, data) => {
      // Use _liveVideoForControl so commands work even after loop count is exhausted
      // (window.currentVideo is nulled when loops finish, but _liveVideoForControl persists).
      const v = window._liveVideoForControl || window.currentVideo;
      if (!v) return;
      if (data.action === 'sync') {
        // If loops were exhausted (currentVideo is null) and a play/seek arrives,
        // restore currentVideo so the drawFrame loop resumes from the correct position.
        if (!window.currentVideo) {
          window.currentVideo = v;
          // Re-trigger the draw loop by requesting a new frame.
          if (typeof v.requestVideoFrameCallback === 'function') {
            const _rld = () => {
              if (window.currentVideo !== v) return;
              const canvas = document.getElementById('liveCanvas');
              if (!canvas) return;
              const ctx = canvas.getContext('2d');
              if (v.readyState >= 2) ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
              v.requestVideoFrameCallback(_rld);
            };
            v.requestVideoFrameCallback(_rld);
          } else {
            const _rld = () => {
              if (window.currentVideo !== v) return;
              const canvas = document.getElementById('liveCanvas');
              if (!canvas) return;
              const ctx = canvas.getContext('2d');
              if (v.readyState >= 2) ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
              requestAnimationFrame(_rld);
            };
            requestAnimationFrame(_rld);
          }
        }
        // Apply each state property only when present so callers can omit fields they don't want to force
        if (typeof data.playbackRate === 'number') v.playbackRate = data.playbackRate;
        if (typeof data.currentTime === 'number') v.currentTime = data.currentTime;
        if (typeof data.paused === 'boolean') {
          if (data.paused && !v.paused) v.pause();
          else if (!data.paused && v.paused) { try { v.play(); } catch (e) {} }
        }
      } else if (data.action === 'audio-output' && typeof data.deviceId === 'string') {
        window._audioOutputDeviceId = data.deviceId;
        if (typeof v.setSinkId === 'function') {
          v.setSinkId(data.deviceId).catch(() => {});
        }
      }
      // Legacy individual-command support (for any older code paths)
      else if (data.action === 'play') { try { v.play(); } catch (e) {} }
      else if (data.action === 'pause') { v.pause(); }
      else if (data.action === 'seek' && typeof data.time === 'number') { v.currentTime = data.time; }
      else if (data.action === 'speed' && typeof data.rate === 'number') { v.playbackRate = data.rate; }
    });
    
    ipcRenderer.on('show-live-text', () => {
      // Cancel any ongoing animations
      if (currentAnimationFrameId) {
        cancelAnimationFrame(currentAnimationFrameId);
        currentAnimationFrameId = null;
      }
      
      isClearMode = false;
      isBlackMode = false;
      
      if (window.currentContent) {
        // Restore content with fade-in transition
        const width = canvas.width;
        const height = canvas.height;
        
        // Update currentRenderContent first
        currentRenderContent = window.currentContent;
        currentRenderWidth = width;
        currentRenderHeight = height;
        
        // Render background first, then fade in text
        const _sltMedia = window.currentContent.backgroundMedia || null;
        const _doFadeIn = () => {
          drawLicenseWatermark();
          if (window.currentContent.transitionIn) {
            applyTextFadeInAnimation(window.currentContent.transitionIn.duration, window.currentContent.transitionIn.type || 'fade');
          }
        };
        if (_sltMedia && _sltMedia.type === 'COLOR') {
          clearGifBg();
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, width, height);
          applyColorToCanvas(ctx, _sltMedia.color, width, height);
          _doFadeIn();
        } else if (_sltMedia && _sltMedia.type === 'GIF') {
          setGifBg(_sltMedia.path, _sltMedia);
          ctx.clearRect(0, 0, width, height);
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.fillRect(0, 0, width, height);
          _doFadeIn();
        } else if (_sltMedia && isStaticImageType(_sltMedia.type)) {
          clearGifBg();
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, width, height);
          const bgImg = new Image();
          bgImg.onload = () => {
            drawImageWithSettings(ctx, bgImg, width, height, {
              bgSize: _sltMedia.bgSize || 'cover',
              bgRepeat: _sltMedia.bgRepeat || 'no-repeat',
              bgPosition: _sltMedia.bgPosition || 'center'
            });
            _doFadeIn();
          };
          bgImg.src = _fileUrlFor(_sltMedia.path);
        } else {
          clearGifBg();
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, width, height);
          _doFadeIn();
        }
      }
    });
    
    ipcRenderer.on('set-live-black', () => {
      // Cancel any ongoing animations
      if (currentAnimationFrameId) {
        cancelAnimationFrame(currentAnimationFrameId);
        currentAnimationFrameId = null;
      }
      
      isClearMode = false;
      isBlackMode = true;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Draw watermark after background fill so it appears under any text drawn later
      drawLicenseWatermark();
    });
    
    ipcRenderer.on('reset-live-canvas', () => {
      // Cancel any ongoing animations
      if (currentAnimationFrameId) {
        cancelAnimationFrame(currentAnimationFrameId);
        currentAnimationFrameId = null;
      }
      
      isClearMode = false;
      isBlackMode = false;
      if (window.currentContent) {
        renderContent(window.currentContent);
        // renderContent will call show-live-text logic which will draw watermark between background and text
      } else {
        // still ensure watermark is visible over background-only states
        drawLicenseWatermark();
      }
    });

    // Signal to main process that all IPC listeners are registered and ready to receive content
    ipcRenderer.send('live-window-ready');
  </script>
