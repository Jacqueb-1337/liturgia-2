<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liturgia</title>
  <style>
    :root{--bg1:#0f1720;--bg2:#141923;--accent:#0078d4}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));-webkit-font-smoothing:antialiased}
    .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
    .card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;border-radius:14px;background:transparent;} /* background was linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow:0 10px 30px rgba(0,0,0,0.6) */
    img.logo{width:190px;height:190px;border-radius:12px;object-fit:cover}
    .motto{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; color:#fff; font-weight:600; font-size:18px; position:relative; overflow:visible;}
    .motto .mask{display:inline-block; clip-path:inset(0 100% 0 0); transition:clip-path 900ms cubic-bezier(.2,.9,.2,1)}
    .motto.revealed .mask{clip-path:inset(0 0 0 0)}

    /* fade out state - DISABLED, let main window show instead */
    .splash-fade{opacity:1;transition:none}

    /* small subtle loading bar */
    .loader-container{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
    .loader{height:4px;width:160px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;opacity:0;transition:opacity 400ms ease-in}
    .loader.visible{opacity:1}
    .loader > .bar{width:0;height:100%;background:linear-gradient(90deg,var(--accent),#00b0ff);transition:width 250ms ease-out}
    .status-text{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;color:rgba(255,255,255,0.6);font-size:12px;height:14px;min-width:160px;text-align:center;opacity:0;transition:opacity 400ms ease-in}
    .status-text.visible{opacity:1}

    /* keep a solid gradient background so fade reveals the app beneath without flashing */
    /* body remains with gradient defined above */
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <img class="logo" src="loading.gif" alt="Liturgia">
      <div class="motto" id="motto"><span class="mask">Worship without distraction.</span></div>
      <div class="loader-container">
        <div class="loader" ><div class="bar" id="bar"></div></div>
        <div class="status-text" id="status-text"></div>
      </div>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    
    let currentProgress = 0;
    const bar = document.getElementById('bar');
    const loader = document.querySelector('.loader');
    const statusText = document.getElementById('status-text');
    const motto = document.getElementById('motto');
    
    console.log('[splash] Splash HTML loaded, setting up listeners');

    // Listen to splash status updates from main process (what we're waiting on)
    ipcRenderer.on('splash:update-status', (event, data) => {
      if (data && data.message) {
        console.log('[splash] Received status update: ' + data.message + ' (' + (data.progress || 0) + '%)');
        statusText.textContent = data.message;
        
        // Animate progress bar to the new progress value
        const newProgress = data.progress || 0;
        bar.style.transition = 'width 500ms ease-out';
        bar.style.width = newProgress + '%';
      }
    });
    
    console.log('[splash] splash:update-status listener registered');

    (function(){
      setTimeout(()=>{
        motto.classList.add('revealed');
      }, 700);
      setTimeout(()=>{
        loader.classList.add('visible');
        setTimeout(()=>{
          statusText.classList.add('visible');
        }, 500);
      }, 1200);
    })();
  </script>
</body>
</html>
